name: Schedule - Cypress API
on:
    schedule: 
        - cron: '*/5 * * * *'
          timezone: 'America/Sao_Paulo'
    workflow_dispatch: 
jobs: 
    cypress-run:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout
          uses: actions/checkout@v7
        - name: Cypress run
          uses: cypress-io/github-action@v7